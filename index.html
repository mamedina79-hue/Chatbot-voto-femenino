<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chatbot</title>
</head>
<body>

<h2>Chatbot voto femenino</h2>

<div id="chat"></div>

<input type="text" id="input">
<button onclick="responder()">Enviar</button>

<script>
function responder() {
  let input = document.getElementById("input").value.toLowerCase();
  let chat = document.getElementById("chat");

  chat.innerHTML += "<p><b>Tú:</b> " + input + "</p>";

  let respuesta = "No entiendo la pregunta";

  if (input.includes("hola")) {
    respuesta = "Hola, pregúntame sobre el voto femenino en Colombia";
  }
  else if (input.includes("cuando")) {
    respuesta = "El voto femenino fue aprobado en 1954";
  }
  else if (input.includes("primera")) {
    respuesta = "Las mujeres votaron por primera vez en 1957";
  }

  chat.innerHTML += "<p><b>Bot:</b> " + respuesta + "</p>";
}
</script>

</body>
</html>
